# Tailnet-only names: *.labserver.artsofweb.com -> this VM's Tailscale IP.
# The bare labserver.artsofweb.com keeps its public answer (forwarded to 1.1.1.1).
listen-address=100.69.92.42
bind-dynamic
except-interface=lo
no-resolv
no-hosts
address=/*.labserver.artsofweb.com/100.69.92.42
server=/labserver.artsofweb.com/1.1.1.1
